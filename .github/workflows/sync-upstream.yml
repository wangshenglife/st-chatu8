name: Sync upstream main

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'wangshenglife/st-chatu8'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply upstream changes
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/damoshen123/st-chatu8.git
          git fetch upstream main
          current_version="$(node -p "require('./manifest.json').version")"
          upstream_version="$(git show upstream/main:manifest.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          target="$(git rev-parse upstream/main)"
          if [ "$current_version" = "$upstream_version" ]; then
            echo "Plugin version is unchanged ($current_version); fork main will not be updated."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Plugin version changed: $current_version -> $upstream_version"
          mkdir -p "$RUNNER_TEMP/fork-meta"
          cp -R .github/. "$RUNNER_TEMP/fork-meta/"
          cp FORK_MAINTENANCE.md "$RUNNER_TEMP/FORK_MAINTENANCE.md"
          git read-tree --reset -u upstream/main
          mkdir -p .github
          cp -R "$RUNNER_TEMP/fork-meta/." .github/
          cp "$RUNNER_TEMP/FORK_MAINTENANCE.md" FORK_MAINTENANCE.md
          git add -A
          git cherry-pick --no-commit 6edc2a7
          git cherry-pick --no-commit fed4b40
          printf '%s\n' "$target" > .github/upstream-main.sha
          git add -A
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check JavaScript syntax
        if: steps.sync.outputs.changed == 'true'
        run: node --check index.js

      - name: Commit upstream update
        if: steps.sync.outputs.changed == 'true'
        run: |
          short_sha="$(git rev-parse --short upstream/main)"
          git commit -m "chore: sync upstream main to $short_sha"

      - name: Push fork main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main
